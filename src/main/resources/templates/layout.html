<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">AnkarD</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

    <!-- NAV -->
    <nav>
        <div style="display:inline-block;">
            <a th:href="@{/}">Decks</a>
            <span> | </span>
            <a th:href="@{/decks/new}">Tạo Deck</a>
        </div>
        <div style="display:inline-block; float:right;">
            <span th:if="${username != null}">Xin chào <strong th:text="${username}"></strong></span>
            <a th:if="${username != null}" th:href="@{/account}" style="margin-left:12px;">Tài khoản</a>
            <form th:if="${username != null}" th:action="@{/logout}" method="post"
                style="display:inline; margin-left:12px;">
                <button type="submit">Đăng xuất</button>
            </form>
            <a th:if="${username == null}" th:href="@{/login}" style="margin-left:12px;">Đăng nhập</a>
        </div>
    </nav>

    <hr />

    <!-- Flash messages -->
    <div th:if="${success}" class="msg-success">
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="msg-error">
        <span th:text="${error}"></span>
    </div>

    <!-- Nội dung chính -->
    <main th:replace="${content}">
        <!-- page content goes here -->
    </main>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
