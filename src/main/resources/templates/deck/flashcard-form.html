<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sửa Flashcard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav>
    <a th:href="@{/}">← Trang chủ</a>
    <span> | </span>
    <a th:href="@{/decks/{id}(id=${deckId})}">← Quay lại Deck</a>
</nav>
<hr/>

<h2>Sửa Flashcard</h2>

<form th:action="@{/decks/{deckId}/flashcards/{cardId}/edit(deckId=${deckId}, cardId=${flashcardId})}"
      th:object="${flashcardForm}"
      method="post">

    <table>
        <tr>
            <td><label>Mặt trước *</label></td>
            <td>
                <input type="text" th:field="*{frontContent}" size="50"/>
                <span th:if="${#fields.hasErrors('frontContent')}"
                      th:errors="*{frontContent}" class="field-error"></span>
            </td>
        </tr>
        <tr>
            <td><label>Mặt sau *</label></td>
            <td>
                <input type="text" th:field="*{backContent}" size="50"/>
                <span th:if="${#fields.hasErrors('backContent')}"
                      th:errors="*{backContent}" class="field-error"></span>
            </td>
        </tr>
        <tr>
            <td><label>Phát âm</label></td>
            <td><input type="text" th:field="*{pronunciation}" size="50"/></td>
        </tr>
        <tr>
            <td><label>Câu ví dụ</label></td>
            <td><textarea th:field="*{exampleSentence}" rows="3" cols="50"></textarea></td>
        </tr>
        <tr>
            <td><label>URL ảnh</label></td>
            <td><input type="text" th:field="*{imageUrl}" size="50"/></td>
        </tr>
        <tr>
            <td><label>URL âm thanh</label></td>
            <td><input type="text" th:field="*{audioUrl}" size="50"/></td>
        </tr>
    </table>

    <br/>
    <button type="submit">Lưu thay đổi</button>
    <a th:href="@{/decks/{id}(id=${deckId})}">
        <button type="button">Hủy</button>
    </a>
</form>

</body>
</html>
