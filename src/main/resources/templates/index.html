<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnkarD - Bảng điều khiển</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .nav-link {
            @apply text-sm font-bold text-gray-500 hover:text-blue-600 transition-colors uppercase tracking-widest;
        }

        .deck-card {
            @apply bg-white p-8 rounded-[2.5rem] shadow-[0_10px_40px_rgba(0, 0, 0, 0.03)] border border-gray-50 hover:shadow-[0_20px_50px_rgba(0, 0, 0, 0.06)] hover:-translate-y-1 transition-all duration-300;
        }

        .stat-box {
            @apply flex flex-col items-center justify-center p-3 rounded-2xl bg-gray-50;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-7xl mx-auto w-full px-4 py-12">

        <header class="mb-12 flex flex-col md:flex-row justify-between items-end gap-6">
            <div class="space-y-2">
                <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Thư viện của tôi</h1>
                <p class="text-gray-400 italic">Hôm nay bạn muốn học thêm điều gì mới?</p>
            </div>
            <a th:href="@{/decks/new}"
                class="w-full md:w-auto bg-gray-900 text-white font-bold py-4 px-8 rounded-2xl shadow-xl hover:bg-black transition-all active:scale-[0.98] text-center">
                + TẠO BỘ THẺ MỚI
            </a>
        </header>

        <div th:if="${success}"
            class="mb-8 p-5 bg-green-50 text-green-700 rounded-3xl border border-green-100 text-center font-bold shadow-sm"
            th:text="${success}"></div>
        <div th:if="${error}"
            class="mb-8 p-5 bg-red-50 text-red-700 rounded-3xl border border-red-100 text-center font-bold shadow-sm"
            th:text="${error}"></div>

        <div th:if="${#lists.isEmpty(decks)}"
            class="py-32 text-center bg-white rounded-[3rem] border-2 border-dashed border-gray-100">
            <div class="text-6xl mb-6">📚</div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Chưa có bộ thẻ nào</h2>
            <p class="text-gray-400 mb-8 italic">Hãy bắt đầu bằng cách tạo một bộ thẻ đầu tiên của bạn.</p>
            <a th:href="@{/decks/new}"
                class="inline-block bg-blue-600 text-white font-black py-4 px-10 rounded-2xl shadow-xl shadow-blue-100 hover:bg-blue-700 transition">TẠO
                NGAY</a>
        </div>

        <div th:unless="${#lists.isEmpty(decks)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div th:each="deck : ${decks}" class="deck-card flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-6">
                        <span
                            class="px-3 py-1 bg-gray-50 text-gray-400 text-[10px] font-black rounded-full uppercase tracking-widest"
                            th:text="${deck.status}">PRIVATE</span>
                        <span class="text-[10px] font-black text-gray-300 uppercase tracking-widest"
                            th:text="'Tổng: ' + ${deck.totalCards}">TOTAL: 0</span>
                    </div>

                    <h3 class="text-2xl font-extrabold text-gray-900 mb-2 truncate">
                        <a th:href="@{/decks/{id}(id=${deck.deckId})}" th:text="${deck.title}"
                            class="hover:text-blue-600 transition">Tên deck</a>
                    </h3>
                    <p class="text-gray-400 text-sm italic line-clamp-2 mb-8"
                        th:text="${deck.description != null ? deck.description : 'Không có mô tả...'}">Mô tả</p>

                    <div class="grid grid-cols-3 gap-3 mb-8">
                        <div class="stat-box">
                            <span class="text-lg font-black text-blue-600" th:text="${deck.newCards}">0</span>
                            <span class="text-[8px] font-black text-gray-400 uppercase tracking-tighter">Mới</span>
                        </div>
                        <div class="stat-box">
                            <span class="text-lg font-black text-red-500" th:text="${deck.learningCards}">0</span>
                            <span class="text-[8px] font-black text-gray-400 uppercase tracking-tighter">Đang học</span>
                        </div>
                        <div class="stat-box">
                            <span class="text-lg font-black text-green-500" th:text="${deck.reviewCards}">0</span>
                            <span class="text-[8px] font-black text-gray-400 uppercase tracking-tighter">Ôn tập</span>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <div th:if="${deck.newCards + deck.learningCards + deck.reviewCards > 0}" class="flex-grow">
                        <a th:href="@{/study/{id}(id=${deck.deckId})}">
                            <button
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-100 transition-all active:scale-[0.95] text-sm italic uppercase tracking-wider">Học
                                ngay</button>
                        </a>
                    </div>
                    <div th:unless="${deck.newCards + deck.learningCards + deck.reviewCards > 0}" class="flex-grow">
                        <button disabled
                            class="w-full bg-green-50 text-green-600 font-bold py-3 px-4 rounded-xl border border-green-100 text-xs italic">✓
                            Đã xong hôm nay</button>
                    </div>

                    <a th:href="@{/decks/{id}(id=${deck.deckId})}" class="flex-none">
                        <button
                            class="p-3 bg-gray-50 hover:bg-gray-100 text-gray-400 hover:text-gray-900 rounded-xl transition"
                            title="Quản lý bộ thẻ">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </main>



</body>

</html>
