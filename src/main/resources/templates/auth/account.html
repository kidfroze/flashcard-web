<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cài đặt tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .form-input {
            @apply mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm;
            border: 1px solid #d1d5db;
            padding: 0.5rem;
        }
    </style>
</head>

<body class="antialiased text-gray-900">

    <nav class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center">
            <a th:href="@{/}" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 transition">
                ← Quay lại trang chủ
            </a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Cài đặt tài khoản</h1>
            <p class="text-gray-500 mt-2">Quản lý thông tin cá nhân và bảo mật tài khoản của bạn.</p>
        </header>

        <div th:if="${success}"
            class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 rounded shadow-sm flex items-center">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                    clip-rule="evenodd"></path>
            </svg>
            <span th:text="${success}">Cập nhật thành công!</span>
        </div>
        <div th:if="${error}"
            class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded shadow-sm flex items-center">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                    clip-rule="evenodd"></path>
            </svg>
            <span th:text="${error}">Đã xảy ra lỗi!</span>
        </div>

        <div class="space-y-8">
            <section class="bg-white shadow rounded-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h3 class="text-lg font-semibold text-gray-800">Cập nhật Email</h3>
                </div>
                <div class="p-6">
                    <form th:action="@{/account/update-email}" method="post" th:object="${accountForm}"
                        class="grid grid-cols-1 gap-6 md:grid-cols-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Mật khẩu hiện tại</label>
                            <input type="password" name="currentPassword" th:value="*{currentPassword}" required
                                class="form-input" placeholder="••••••••" />

                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Email mới</label>
                            <input type="email" name="email" th:value="*{email}" required class="form-input"
                                placeholder="example@domain.com" />
                        </div>
                        <div class="md:col-span-2">
                            <button type="submit"
                                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                                Lưu email mới
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="bg-white shadow rounded-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h3 class="text-lg font-semibold text-gray-800">Đổi mật khẩu</h3>
                </div>
                <div class="p-6">
                    <form th:action="@{/account/change-password}" method="post" th:object="${accountForm}"
                        class="space-y-4">
                        <div class="max-w-md">
                            <label class="block text-sm font-medium text-gray-700">Mật khẩu hiện tại</label>
                            <input type="password" name="currentPassword" th:value="*{currentPassword}" required
                                class="form-input" />
                        </div>
                        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Mật khẩu mới</label>
                                <input type="password" name="newPassword" th:value="*{newPassword}" required
                                    class="form-input" />
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nhập lại mật khẩu mới</label>
                                <input type="password" name="confirmNewPassword" th:value="*{confirmNewPassword}"
                                    required class="form-input" />
                            </div>
                        </div>
                        <div class="pt-2">
                            <button type="submit"
                                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition">
                                Cập nhật mật khẩu
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="bg-red-50 shadow rounded-lg border border-red-100 overflow-hidden">
                <div class="px-6 py-4 border-b border-red-100 flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-red-800">Vùng nguy hiểm</h3>
                        <p class="text-sm text-red-600">Xóa tài khoản vĩnh viễn và không thể khôi phục.</p>
                    </div>
                    <form th:action="@{/account/delete}" method="post"
                        onsubmit="return confirm('Bạn chắc chắn muốn xóa tài khoản? Hành động này không thể hoàn tác.');">
                        <button type="submit"
                            class="px-4 py-2 bg-red-600 text-white text-sm font-bold rounded-md hover:bg-red-700 transition shadow-sm">
                            Xóa tài khoản
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </div>

</body>

</html>
