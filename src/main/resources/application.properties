# =====================
# Database Configuration (SQL Server)
# =====================
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS_3;databaseName=english_learning_flashcard;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=071105
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# =====================
# Thymeleaf
# =====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =====================
# App Settings
# =====================
server.port=8080

# Hard-coded user id cho demo (bỏ qua login)
# app.demo.user-id=1

# =====================
# Request / Response Logging
# =====================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG